[project]
name = "logfile"
version = "0.1.3"
requires-python = "==3.14.*"
dependencies = [
    "pyepics>=3.5.10",
    "pyqt5>=5.15.11",
    "pyshortcuts>=1.9.10",
    "qtpy>=2.4.3",
]

[project.scripts]
logfile = "logfile:main"

[project.urls]
Homepage = "https://github.com/GSECARS/Logfile"
Issues = "https://github.com/GSECARS/Logfile/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["logfile"]
include = ["logfile/icons/*.png", "logfile/icons/*.ico"]

[tool.ruff]
exclude = [
    ".eggs",
    ".git",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".venv",
    ".vscode",
    "build",
    "dist",
]
line-length = 160
indent-width = 4
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = []
fixable = ["ALL"]
unfixable = []
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = false
docstring-code-line-length = "dynamic"
